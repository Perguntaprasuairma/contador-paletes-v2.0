<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LH Control - Contador de Paletes</title>

<style>

*{
    box-sizing:border-box;
}

body {

    font-family:Arial, sans-serif;
    background:#111;
    color:#fff;
    margin:0;
    padding:10px;

}


h1 {

    text-align:center;
    font-size:24px;

}


.total {

    background:#222;
    padding:15px;
    border-radius:12px;
    text-align:center;
    font-size:20px;
    margin-bottom:15px;

}


.item {

    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:8px 0;
    padding:12px;
    border-radius:12px;
    font-weight:bold;
    gap:10px;

}


.nome {

    flex:1;
    word-break:break-word;

}


.controls {

    display:flex;
    align-items:center;
    justify-content:center;
    gap:3px;
    flex-wrap:wrap;
    max-width:100%;

}


button {

    border:none;
    border-radius:8px;
    color:white;
    font-weight:bold;
    cursor:pointer;

}


.controls button {

    width:32px;
    height:32px;
    font-size:11px;
    padding:0;

}


.controls .minus {

    background:#d50000;

}


.controls .big {

    background:#1565c0;

}


.count {

    background:#000;
    color:#fff;
    padding:8px;
    min-width:35px;
    text-align:center;
    border-radius:8px;

}



.actions {

    margin-top:20px;
    display:flex;
    flex-direction:column;
    gap:10px;

}


.actions button {

    padding:14px;
    font-size:16px;
    background:#0066ff;

}



textarea {

    width:100%;
    margin-top:15px;
    height:160px;
    border-radius:10px;
    padding:10px;

}

<script>

const locais = [

{
nome:"Rio de Janeiro – RJ01",
classe:"rio"
},

{
nome:"Santana – SP0",
classe:"santana"
},

{
nome:"Simões Filho – BA",
classe:"simoes"
},

{
nome:"Betim – MG",
classe:"betim"
},

{
nome:"Curitiba – PR",
classe:"curitiba"
},

{
nome:"Cravinhos – SP05",
classe:"cravinhos"
},

{
nome:"Jaboatão dos Guararapes",
classe:"jaboatao"
},

{
nome:"Louveira – SP07",
classe:"louveira"
},

{
nome:"Gravataí – RS",
classe:"gravatai"
},

{
nome:"Goiânia – GO02",
classe:"goiania"
}

];


let contagem = JSON.parse(localStorage.getItem("lh_control")) || {};



function salvar(){

localStorage.setItem(
"lh_control",
JSON.stringify(contagem)
);

}



function alterar(local, valor){


if(!contagem[local]){

contagem[local]=0;

}


contagem[local]+=valor;


if(contagem[local]<0){

contagem[local]=0;

}


render();


}




function calcularTotal(){


let soma=0;


locais.forEach(local=>{

soma += contagem[local.nome] || 0;

});


document.getElementById("total").innerText=soma;


}




function render(){


const list=document.getElementById("list");

list.innerHTML="";



locais.forEach(local=>{


if(!contagem[local.nome]){

contagem[local.nome]=0;

}



list.innerHTML += `


<div class="item ${local.classe}">


<div class="nome">

${local.nome}

</div>



<div class="controls">


<button class="minus" onclick="alterar('${local.nome}',-10)">
-10
</button>


<button class="minus" onclick="alterar('${local.nome}',-5)">
-5
</button>


<button class="minus" onclick="alterar('${local.nome}',-1)">
-1
</button>



<span class="count">

${contagem[local.nome]}

</span>



<button onclick="alterar('${local.nome}',1)">
+1
</button>


<button class="big" onclick="alterar('${local.nome}',5)">
+5
</button>


<button class="big" onclick="alterar('${local.nome}',10)">
+10
</button>


</div>


</div>


`;


});



salvar();

calcularTotal();


}




function gerarRelatorio(){


let texto="";


locais.forEach(local=>{


texto += `${local.nome}: ${contagem[local.nome] || 0}\n`;


});


texto += `\nTotal de Paletes: ${document.getElementById("total").innerText}`;


document.getElementById("output").value=texto;


}





function copiar(){


const area=document.getElementById("output");


area.select();


document.execCommand("copy");


alert("Relatório copiado!");


}





function compartilhar(){


const texto=document.getElementById("output").value;



if(navigator.share){


navigator.share({

title:"LH Control",

text:texto

});


}else{


alert("Compartilhamento não disponível");


}


}





function resetar(){


if(confirm("Deseja zerar todos os paletes?")){


contagem={};


render();


}


}



render();


</script>


</body>

</html>

/* CORES FAN OUT */


.rio {

    background:#555;

}


.santana {

    background:linear-gradient(90deg,#1565c0,#ec407a);

}


.simoes {

    background:#0277bd;

}


.betim {

    background:#827717;

}


.curitiba {

    background:#2e7d32;

}


.cravinhos {

    background:#000;

}


.jaboatao {

    background:#6a1b9a;

}


.louveira {

    background:#6d4c41;

}


.gravatai {

    background:#f9a825;
    color:#000;

}


.gravatai .count {

    background:#fff;
    color:#000;
    font-weight:bold;

}


.goiania {

    background:#ef6c00;

}



/* RESPONSIVO CELULAR */


@media(max-width:600px){


body{

    padding:5px;

}


h1{

    font-size:20px;

}


.item{

    flex-direction:column;
    align-items:stretch;

}


.nome{

    text-align:center;
    font-size:14px;

}


.controls{

    justify-content:center;

}


.controls button{

    width:30px;
    height:30px;
    font-size:10px;

}


.count{

    padding:6px;
    min-width:40px;

}


}

</style>

</head>


<body>


<h1>📦 LH Control</h1>


<div class="total">

Total de Paletes:
<span id="total">0</span>

</div>


<div id="list"></div>


<div class="actions">


<button onclick="gerarRelatorio()">

📋 Gerar Relatório

</button>


<button onclick="copiar()">

📄 Copiar

</button>


<button onclick="compartilhar()">

📲 Compartilhar

</button>


<button onclick="resetar()">

🔄 Resetar

</button>


</div>


<textarea id="output"></textarea>
