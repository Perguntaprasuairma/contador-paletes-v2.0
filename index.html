<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LH Control - Contador de Paletes</title>

<style>

body {
    font-family: Arial, sans-serif;
    background:#111;
    color:#fff;
    margin:0;
    padding:10px;
}

h1 {
    text-align:center;
    font-size:24px;
}

.total {
    background:#222;
    padding:15px;
    border-radius:12px;
    text-align:center;
    font-size:20px;
    margin-bottom:15px;
}

.item {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:8px 0;
    padding:12px;
    border-radius:12px;
    font-weight:bold;
}

.nome {
    flex:1;
}

.controls {
    display:flex;
    align-items:center;
    gap:4px;
}

button {
    border:none;
    border-radius:8px;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.controls button {
    width:38px;
    height:35px;
    font-size:14px;
    background:#00c853;
}

.controls .minus {
    background:#d50000;
}

.controls .big {
    background:#1565c0;
}

.count {
    background:#000;
    padding:8px;
    min-width:35px;
    text-align:center;
    border-radius:8px;
}

.actions {
    margin-top:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.actions button {
    padding:14px;
    font-size:16px;
    background:#0066ff;
}

textarea {
    width:100%;
    margin-top:15px;
    height:160px;
    border-radius:10px;
}


/* CORES FAN OUT */

.rio {
    background:#555;
}

.santana {
    background:linear-gradient(90deg,#1565c0,#ec407a);
}

.simoes {
    background:#0277bd;
}

.curitiba {
    background:#2e7d32;
}

.betim {
    background:#827717;
}

.cravinhos {
    background:#000;
}

.jaboatao {
    background:#6a1b9a;
}

.louveira {
    background:#6d4c41;
}

..gravatai {
    background:#f9a825;
    color:#000;
}

.gravatai .count {
    background:#ffffff;
    color:#000000;
    font-weight:bold;
}

.goiania {
    background:#ef6c00;
}

.verde {
    background:#388e3c;
}


</style>

</head>


<body>


<h1>📦 LH Control</h1>


<div class="total">
Total de Paletes: <span id="total">0</span>
</div>


<div id="list"></div>


<div class="actions">

<button onclick="gerarRelatorio()">📋 Gerar Relatório</button>

<button onclick="copiar()">📄 Copiar</button>

<button onclick="compartilhar()">📲 Compartilhar</button>

<button onclick="resetar()">🔄 Resetar</button>

</div>


<textarea id="output"></textarea>



<script>


const locais = [

{
nome:"Rio de Janeiro – RJ01",
classe:"rio"
},

{
nome:"Santana – SP0",
classe:"santana"
},

{
nome:"Simões Filho – BA",
classe:"simoes"
},

{
nome:"Curitiba – PR",
classe:"curitiba"
},

{
nome:"Betim – MG",
classe:"betim"
},

{
nome:"Cravinhos – SP05",
classe:"cravinhos"
},

{
nome:"Jaboatão dos Guararapes",
classe:"jaboatao"
},

{
nome:"Louveira – SP07",
classe:"louveira"
},

{
nome:"Gravataí – RS",
classe:"gravatai"
},

{
nome:"Goiânia – GO02",
classe:"goiania"
},

{
nome:"Itajaí – SC",
classe:"verde"
},

{
nome:"LONDRINA - LPR20",
classe:"verde"
},

{
nome:"MARINGA - LPR18",
classe:"verde"
}

];


let contagem =
JSON.parse(localStorage.getItem("lh_control")) || {};


function salvar(){

localStorage.setItem(
"lh_control",
JSON.stringify(contagem)
);

}



function alterar(local,valor){

if(!contagem[local])
contagem[local]=0;


contagem[local]+=valor;


if(contagem[local]<0)
contagem[local]=0;


render();

}



function total(){

let soma=0;

locais.forEach(l=>{

soma+=contagem[l.nome]||0;

});


document.getElementById("total").innerText=soma;

}



function render(){


const list=document.getElementById("list");

list.innerHTML="";


locais.forEach(local=>{


if(!contagem[local.nome])
contagem[local.nome]=0;


list.innerHTML+=`

<div class="item ${local.classe}">

<div class="nome">
${local.nome}
</div>


<div class="controls">

<button class="minus" onclick="alterar('${local.nome}',-10)">-10</button>

<button class="minus" onclick="alterar('${local.nome}',-5)">-5</button>

<button class="minus" onclick="alterar('${local.nome}',-1)">-1</button>


<span class="count">
${contagem[local.nome]}
</span>


<button onclick="alterar('${local.nome}',1)">+1</button>

<button class="big" onclick="alterar('${local.nome}',5)">+5</button>

<button class="big" onclick="alterar('${local.nome}',10)">+10</button>


</div>

</div>

`;


});


salvar();

total();


}



function gerarRelatorio(){

let texto="";


locais.forEach(l=>{

texto+=`${l.nome}: ${contagem[l.nome]||0}\n`;

});


texto+=`\nTotal de Paletes: ${document.getElementById("total").innerText}`;


document.getElementById("output").value=texto;


}



function copiar(){

let area=document.getElementById("output");

area.select();

document.execCommand("copy");

alert("Relatório copiado!");

}



function compartilhar(){

let texto=document.getElementById("output").value;


if(navigator.share){

navigator.share({

title:"LH Control",

text:texto

});

}

else{

alert("Compartilhamento não disponível");

}


}



function resetar(){

if(confirm("Zerar todos os paletes?")){

contagem={};

render();

}


}



render();


</script>


</body>
</html>

</section>







<section class="acoes">


<button onclick="resetarTudo()">

🔄 Resetar

</button>


</section>





<script src="config.js"></script>

<script src="storage.js"></script>

<script src="stage.js"></script>

<script src="app.js"></script>

id="relatorio"

placeholder="O relatório aparecerá aqui...">

</textarea>
